<svg viewBox="0 0 280 70" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Remedy Cooling and Heating">
  <!-- Rx mark -->
  <text x="2" y="50" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="56" fill="#CC2222">R</text>
  <!-- EKG / heartbeat line -->
  <polyline points="22,42 27,42 31,30 35,54 39,36 43,42 48,42"
    stroke="#CC2222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- x subscript -->
  <text x="35" y="62" font-family="Arial Narrow, sans-serif" font-weight="700" font-size="18" fill="#CC2222">x</text>

  <!-- REMEDY wordmark -->
  <text x="58" y="38" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="32" fill="#CC2222" letter-spacing="3">REMEDY</text>

  <!-- COOLING &amp; HEATING -->
  <text x="60" y="60" font-family="Arial Narrow, sans-serif" font-weight="700" font-size="17" fill="#1B3899" letter-spacing="1.5">COOLING &amp; HEATING</text>

  <!-- Tagline -->
  <text x="60" y="72" font-family="Arial Narrow, sans-serif" font-weight="600" font-size="9" fill="#1B3899" letter-spacing="1">INSTALLATION · REPAIR · MAINTENANCE</text>
</svg>
